# Copy this block into the production nginx vhost for tenebra-network.com.
# Purpose:
#  - serve the wallet and static assets correctly
#  - force the correct MIME type for .wasm files
#  - allow browser POST calls to /api/* from the public wallet page
#  - keep the public UI and API on the same public origin when possible

server {
    listen 443 ssl http2;
    server_name tenebra-network.com www.tenebra-network.com;

    root /var/www/tenebra;
    index index.html;

    # Ensure WebAssembly is served as a real wasm resource.
    types {
        application/wasm wasm;
        application/javascript js mjs;
        application/json json;
    }

    location = /health {
        proxy_pass http://127.0.0.1:39455/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(wasm)$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:39455;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin "https://tenebra-network.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://tenebra-network.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            return 204;
        }
    }
}

server {
    listen 80;
    server_name tenebra-network.com www.tenebra-network.com;
    return 301 https://$host$request_uri;
}
